{% extends 'base.html' %}

{% block title %}Password Zurücksetzen{% endblock %}

{% block content %}
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/reset-password.css') }}">
</head>
<div class="profile-card">

    <a href="{{ url_for('signin') }}" class="back">← Back</a>

    <h2 class="title">Password zurücksetzen</h2>

    {% if error %}
    <p style="color: #f58800; text-align: center; margin-bottom: 10px;">{{ error }}</p>
    {% endif %}

    {% if success %}
    <p style="color: #00ff00; text-align: center; margin-bottom: 10px;">{{ success }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('reset_password') }}" style="all: unset;">
        <p class="label">Email</p>
        <input type="email" name="email" class="inputButton" required></input>

        <p class="label">Neues Passwort</p>
        <div class="password-wrapper">
            <input type="password" name="password" class="inputButton" required></input>
            <button type="button" class="toggle-password" data-target="password" aria-label="Passwort anzeigen">👁</button>
        </div>

        <p class="label">Passwort bestätigen</p>
        <div class="password-wrapper">
            <input type="password" name="password_confirm" class="inputButton" required></input>
            <button type="button" class="toggle-password" data-target="password_confirm" aria-label="Passwort anzeigen">👁</button>
        </div>

        <button type="submit" class="saveButton">Passwort zurücksetzen</button>
    </form>

    <a href="{{ url_for('signin') }}" style="text-decoration: underline;">Zurück zum Login</a>

</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            const targetName = this.dataset.target;
            const input = this.closest('.password-wrapper').querySelector('input');
            
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🙈';
            } else {
                input.type = 'password';
                this.textContent = '👁';
            }
        });
    });
</script>
{% endblock %}
